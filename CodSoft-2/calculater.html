<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Basic Calculator</title>
  <style>
    body {
      display: flex;
      height: 100vh;
      justify-content: center;
      align-items: center;
      background: #f5f5f5;
    }
    .calculator {
      background: #222;
      border-radius: 10px;
      padding: 20px;
      box-shadow: 0 5px 20px rgba(0,0,0,0.3);
      width: 320px;
    }
    .display {
      background: #000;
      color: #fff;
      font-size: 2em;
      padding: 20px;
      border-radius: 5px;
      margin-bottom: 10px;
      text-align: right;
      overflow-x: auto;
    }
    .buttons {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 10px;
    }
    .buttons button {
      padding: 20px;
      font-size: 1.2em;
      border: none;
      border-radius: 5px;
      background: #333;
      color: #fff;
      cursor: pointer;
      transition: background 0.2s;
    }
    .buttons button.operator {
      background: #ff9500;
      color: #fff;
    }
    .buttons button.equal {
      background: #28a745;
      color: #fff;
      grid-column: span 2;
    }
    .buttons button.clear {
      background: #dc3545;
      color: #fff;
      grid-column: span 2;
    }
    .buttons button:active {
      background: #777;
    }
  </style>
</head>
<body>
  <div class="calculator">
    <div class="display" id="display">0</div>
    <div class="buttons">
      <button class="clear" id="clear">C</button>
      <button class="operator" data-value="/">÷</button>
      <button class="operator" data-value="*">×</button>
      <button data-value="7">7</button>
      <button data-value="8">8</button>
      <button data-value="9">9</button>
      <button class="operator" data-value="-">-</button>
      <button data-value="4">4</button>
      <button data-value="5">5</button>
      <button data-value="6">6</button>
      <button class="operator" data-value="+">+</button>
      <button data-value="1">1</button>
      <button data-value="2">2</button>
      <button data-value="3">3</button>
      <button data-value="0" style="grid-column: span 2;">0</button>
      <button data-value=".">.</button>
      <button class="equal" id="equal">=</button>
    </div>
  </div>
  <script>
    const display = document.getElementById('display');
    const buttons = document.querySelectorAll('.buttons button');
    let currentInput = '';
    let operator = '';
    let operand1 = null;
    let resetInput = false;

    function updateDisplay(value) {
      display.textContent = value;
    }

    function calculate(a, op, b) {
      a = parseFloat(a);
      b = parseFloat(b);
      if (op === '+') return a + b;
      if (op === '-') return a - b;
      if (op === '*') return a * b;
      if (op === '/') return b === 0 ? 'Error' : a / b;
      return b;
    }

    buttons.forEach(btn => {
      btn.addEventListener('click', () => {
        const value = btn.dataset.value;

        if (btn.classList.contains('clear')) {
          currentInput = '';
          operator = '';
          operand1 = null;
          updateDisplay('0');
        } else if (btn.classList.contains('equal')) {
          if (operator && currentInput !== '' && operand1 !== null) {
            const result = calculate(operand1, operator, currentInput);
            updateDisplay(result);
            currentInput = '' + result;
            operator = '';
            operand1 = null;
            resetInput = true;
          }
        } else if (btn.classList.contains('operator')) {
          if (currentInput !== '') {
            if (operand1 === null) {
              operand1 = currentInput;
            } else if (operator) {
              operand1 = '' + calculate(operand1, operator, currentInput);
              updateDisplay(operand1);
            }
            operator = value;
            resetInput = true;
          }
        } else {
          if (resetInput) {
            currentInput = '';
            resetInput = false;
          }
          if (value === '.' && currentInput.includes('.')) return;
          currentInput += value;
          updateDisplay(currentInput);
        }
      });
    });
  </script>
</body>
</html>
